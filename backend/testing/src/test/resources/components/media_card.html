<component>
    <div class="card-cell">
        <a rid="watch-link" href="">
            <article class="media-card">
                <div class="poster-frame">
                    <img class="poster" rid="poster" />
                </div>
                <div class="content media-card-body">
                    <div class="meta-row">
                        <span class="type"></span>
                        <span class="year"></span>
                    </div>
                    <h3 rid="displayTitle">{{ displayTitle }}</h3>
                    <p class="summary" rid="displaySummary">{{ displaySummary }}</p>
                    <div class="card-details" rid="card-details">
                    </div>
                </div>
            </article>
        </a>
    </div>
</component>
