<html lang="en">

<head-component src="components/standard_head.html"></head-component>

<body data-page="search">
    <component src="components/navbar.html"></component>
    <header class="hero">
        <h1>Search Torrents</h1>
        <p>Search torrent sources and send import requests to the stream service.</p>
    </header>
    <section class="panel controls">
        <div class="controls-header">
            <h2>Search Torrents</h2>
        </div>
        <div class="acquisition-search">
            <!-- <div class="acquisition-actions">
                            <select id="search-sort">
                                <option value="seeders" selected="selected">Sort by Seeders</option>
                                <option value="size">Sort by Size</option>
                            </select>
                        </div> -->
            <form id="acquisition-search-form" class="acquisition-search-box" action="search">
                <select rid="search-category" id="search-category" name="category">
                    <option rid="option-movie" value="MOVIE" selected="selected">Movies</option>
                    <option rid="option-series" value="SERIES">Series</option>
                </select>
                <input rid="search-query" id="search-query" name="query" type="text" value=""
                    placeholder="Search torrent sources" aria-label="Search torrent sources">
                <button type="submit">Search Sources</button>
            </form>
        </div>
    </section>
    <section class="panel search-results-panel">
        <h2>Search Results</h2>
        <p rid="search-message" class="muted">Click Search Sources to run a search.</p>
        <div class="search-results">
            <ul rid="search-results-list" class="search-results-list"></ul>
        </div>
    </section>

</body>

</html>
