server:
  port: 8080

spring:
  application:
    name: api-gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: catalog
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/media/**
        - id: acquisition
          uri: ${ACQUISITION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/acquisition/**
        - id: stream
          uri: ${STREAM_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/stream/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

hms:
  gateway:
    api-key: ${GATEWAY_API_KEY:dev-local-key}
    rate-limit-per-minute: ${GATEWAY_RATE_LIMIT_PER_MINUTE:240}
