services:
  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:${KAFKA_PORT-9092},EXTERNAL://:${KAFKA_EXTERNAL_PORT-29092},CONTROLLER://:${KAFKA_CONTROLLER_PORT-9093}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:${KAFKA_PORT-9092},EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT-9093}

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      # Broker-level message limit
      KAFKA_MESSAGE_MAX_BYTES: 104857600
      # Internal replica fetch limit (must match or exceed message.max.bytes)
      KAFKA_REPLICA_FETCH_MAX_BYTES: 104857600
    ports:
      - "${KAFKA_PORT-9092}:${DOCKER_KAFKA_PORT-9092}"

  api-gateway-service:
    build:
      context: ./backend
      dockerfile: api-gateway-service/Dockerfile
    image: hms/api-gateway-service:0.1.0
    environment:
      CATALOG_SERVICE_URL: http://media-catalog-service:${MEDIA_CATALOG_SERVICE_PORT-8081}
      ACQUISITION_SERVICE_URL: http://media-acquisition-service:${MEDIA_ACQUISITION_SERVICE_PORT-8082}
      STREAM_SERVICE_URL: http://media-stream-service:${MEDIA_STREAM_SERVICE_PORT-8083}
      GATEWAY_API_KEY: dev-local-key
      GATEWAY_RATE_LIMIT_PER_MINUTE: 240
    ports:
      - "${API_GATEWAY_SERVICE_PORT-8080}:${DOCKER_API_GATEWAY_SERVICE_PORT-8080}"
    depends_on:
      - media-catalog-service
      - media-acquisition-service
      - media-stream-service

  media-catalog-service:
    build:
      context: ./backend
      dockerfile: media-catalog-service/Dockerfile
    image: hms/media-catalog-service:0.1.0
    ports:
      - "${MEDIA_CATALOG_SERVICE_PORT-8081}:${DOCKER_MEDIA_CATALOG_SERVICE_PORT-8081}"
    depends_on:
      - kafka
    env_file:
      - .env

  media-acquisition-service:
    init: true
    ipc: host
    build:
      context: ./backend
      dockerfile: media-acquisition-service/Dockerfile
    image: hms/media-acquisition-service:0.1.0
    ports:
      - "${MEDIA_ACQUISITION_SERVICE_PORT-8082}:${DOCKER_MEDIA_ACQUISITION_SERVICE_PORT-8082}"
    depends_on:
      - kafka
    env_file:
      - .env

  media-stream-service:
    build:
      context: ./backend
      dockerfile: media-stream-service/Dockerfile
    image: hms/media-stream-service:0.1.0
    ports:
      - "${MEDIA_STREAM_SERVICE_PORT-8083}:${DOCKER_MEDIA_STREAM_SERVICE_PORT-8083}"
    depends_on:
      - kafka
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    image: hms/frontend:0.1.0
    ports:
      - "${FRONTEND_PORT-5173}:${DOCKER_FRONTEND_PORT-80}"
    depends_on:
      - api-gateway-service
    env_file:
      - .env    
