services:
  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"

  api-gateway-service:
    build:
      context: ./backend
      dockerfile: api-gateway-service/Dockerfile
    image: hms/api-gateway-service:0.1.0
    environment:
      CATALOG_SERVICE_URL: http://media-catalog-service:8081
      ACQUISITION_SERVICE_URL: http://media-acquisition-service:8082
      STREAM_SERVICE_URL: http://media-stream-service:8083
      GATEWAY_API_KEY: dev-local-key
      GATEWAY_RATE_LIMIT_PER_MINUTE: 240
    ports:
      - "8080:8080"
    depends_on:
      - media-catalog-service
      - media-acquisition-service
      - media-stream-service

  media-catalog-service:
    build:
      context: ./backend
      dockerfile: media-catalog-service/Dockerfile
    image: hms/media-catalog-service:0.1.0
    ports:
      - "8081:8081"
    depends_on:
      - kafka

  media-acquisition-service:
    init: true
    ipc: host
    build:
      context: ./backend
      dockerfile: media-acquisition-service/Dockerfile
    image: hms/media-acquisition-service:0.1.0
    ports:
      - "8082:8082"
    depends_on:
      - kafka

  media-stream-service:
    build:
      context: ./backend
      dockerfile: media-stream-service/Dockerfile
    image: hms/media-stream-service:0.1.0
    ports:
      - "8083:8083"
    depends_on:
      - kafka

  frontend:
    build:
      context: ./frontend
    image: hms/frontend:0.1.0
    ports:
      - "5173:80"
    depends_on:
      - api-gateway-service
